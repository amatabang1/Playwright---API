trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  NODE_VERSION: '20.x'
  TEST_TAG: '@Regression'

steps:

# Install Node.js
- task: NodeTool@0
  displayName: 'Install Node.js'
  inputs:
    versionSpec: $(NODE_VERSION)

# Install dependencies
- script: |
    npm ci
  displayName: 'Install NPM Packages'

# Install Playwright browsers
- script: |
    npx playwright install --with-deps
  displayName: 'Install Playwright Browsers'

# Clean previous reports
- script: |
    echo "Cleaning previous reports..."

    rm -rf allure-results
    rm -rf allure-report
    rm -rf playwright-report

    mkdir -p allure-results

    echo "Cleanup complete"
  displayName: 'Clean Previous Reports'

# Run Regression Suite
- script: |
    npx playwright test --grep "$(TEST_TAG)" --workers=4
  displayName: 'Run Regression Tests'
  continueOnError: true

# Generate Allure Report
- script: |
    echo "Generating Allure Report..."

    npm run allure:report

  displayName: 'Generate Allure Report'
  condition: always()

# Verify generated report contents
- script: |
    echo "Verifying Allure Report Contents..."
    ls -la allure-report
    ls -la allure-report/data || true
    ls -la allure-report/widgets || true
  displayName: 'Verify Allure Report'
  condition: always()

# Publish Test Results
- task: PublishTestResults@2
  displayName: 'Publish Test Results'
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '**/results.xml'
    mergeTestResults: true
    failTaskOnFailedTests: false
    testRunTitle: 'Playwright Regression Run'
  condition: always()

# Publish Allure HTML Report
- task: PublishPipelineArtifact@1
  displayName: 'Publish Allure Report'
  inputs:
    targetPath: 'allure-report'
    artifact: 'allure-report'
  condition: always()

# Publish Allure Results
- task: PublishPipelineArtifact@1
  displayName: 'Publish Allure Results'
  inputs:
    targetPath: 'allure-results'
    artifact: 'allure-results'
  condition: always()

# Publish Playwright HTML Report
- task: PublishPipelineArtifact@1
  displayName: 'Publish Playwright Report'
  inputs:
    targetPath: 'playwright-report'
    artifact: 'playwright-report'
  condition: always()