trigger:
  - main

pool:
  vmImage: 'windows-latest'

variables:
  NODE_VERSION: '20.x'
  TEST_TAG: '@Regression'

steps:

# Install Node.js
- task: NodeTool@0
  displayName: 'Install Node.js'
  inputs:
    versionSpec: $(NODE_VERSION)

# Install dependencies
- script: |
    npm ci
  displayName: 'Install NPM Packages'

# Install Playwright browsers
- script: |
    npx playwright install
  displayName: 'Install Playwright Browsers'

# Clean previous reports
- powershell: |
    Write-Host "Cleaning previous reports..."

    if (Test-Path "allure-results") {
      Remove-Item "allure-results" -Recurse -Force
    }

    if (Test-Path "allure-report") {
      Remove-Item "allure-report" -Recurse -Force
    }

    if (Test-Path "playwright-report") {
      Remove-Item "playwright-report" -Recurse -Force
    }

    New-Item -ItemType Directory -Path "allure-results" -Force

    Write-Host "Cleanup complete"
  displayName: 'Clean Previous Reports'

# Run Regression Suite
- script: |
    npx playwright test --grep "$(TEST_TAG)" --workers=2
  displayName: 'Run Regression Tests'
  continueOnError: true

# Generate Allure Report
- script: |
    echo Generating Allure Report...
    npm run allure:report
  displayName: 'Generate Allure Report'
  condition: always()

# Verify generated report contents
- powershell: |
    Write-Host "Verifying Allure Report Contents..."

    if (Test-Path "allure-report") {
      Get-ChildItem "allure-report"
    }

    if (Test-Path "allure-report\data") {
      Get-ChildItem "allure-report\data"
    }

    if (Test-Path "allure-report\widgets") {
      Get-ChildItem "allure-report\widgets"
    }
  displayName: 'Verify Allure Report'
  condition: always()

# Publish Test Results
- task: PublishTestResults@2
  displayName: 'Publish Test Results'
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '**/results.xml'
    mergeTestResults: true
    failTaskOnFailedTests: false
    testRunTitle: 'Playwright Regression Run'
  condition: always()

# Publish Allure HTML Report
- task: PublishPipelineArtifact@1
  displayName: 'Publish Allure Report'
  inputs:
    targetPath: 'allure-report'
    artifact: 'allure-report'
  condition: always()

# Publish Allure Results
- task: PublishPipelineArtifact@1
  displayName: 'Publish Allure Results'
  inputs:
    targetPath: 'allure-results'
    artifact: 'allure-results'
  condition: always()

# Publish Playwright HTML Report
- task: PublishPipelineArtifact@1
  displayName: 'Publish Playwright Report'
  inputs:
    targetPath: 'playwright-report'
    artifact: 'playwright-report'
  condition: always()